name: One-time cancel scheduled RanaSports news on X
on:
  push:
    paths:
      - '.github/workflows/cancel-ranasports-x-queue-20261012.yml'
permissions:
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove only queued RanaSports article posts for both X channels
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const state=JSON.parse(fs.readFileSync('.github/x-publish-state.json','utf8'));
          const token=process.env.BUFFER_API_KEY;
          const org=state.buffer?.organizationId;
          const channels=[
          {account:'RanaMatiusTV',id:state.buffer?.mainChannelId},
          {account:'RanaF1TV',id:state.buffer?.f1ChannelId}
          ];
          if(!token||!org||channels.some(x=>!x.id))throw Error('Missing Buffer credentials or saved channel mapping');
          const q=v=>JSON.stringify(String(v));
          async function gql(query) {
           const r=await fetch('https://api.buffer.com',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({query})});
           const d=await r.json();
           if(!r.ok||d.errors?.length)throw Error('Buffer API '+(d.errors?.[0]?.message||r.status));
           return d.data;
          }
          function isNews(post) {
           const text=post?.text||'';
           return /https?:\/\/(?:www\.)?ranasports\.com\.ar\/noticia\.html\?n=/i.test(text)
           || /https?:\/\/ranamatiustv\.github\.io\/RanaSports\/noticia\.html\?n=/i.test(text);
          }
          async function queuedFor(channelId){
           let posts=[], cursor;
           for(let i=0;i<12;i++){
            const filter='filter:{channelIds:['+q(channelId)+'],status:[scheduled]}';
            const query='query QueueAudit {posts(first:100'+(cursor?',after:'+q(cursor):'')+',input:{organizationId:'+q(org)+','+filter+',sort:[{field:dueAt,direction:asc}]}){edges{node{id text status dueAt channelId}}pageInfo{hasNextPage endCursor}}}';
            const d=await gql(query);const p=d?.posts;
            if(!p?.edges)throw Error('Missing post data');
            posts.push(...p.edges.map(e=>e.node).filter(Boolean));
            if(!p.pageInfo?.hasNextPage)return posts;
            cursor=p.pageInfo.endCursor;if(!cursor)throw Error('Missing queue pagination cursor');
           }
           throw Error('Queue exceeds safety pagination limit');
          }
          (async()=>{
           let total=0,deleted=0,kept=0,failed=0;
           for(const ch of channels){
             const queued=await queuedFor(ch.id);
             console.log('QUEUE channel='+ch.account+' total='+queued.length+' news='+queued.filter(isNews).length);
             total+=queued.length;
             for(const post of queued){
               if(!isNews(post)||post.channelId!==ch.id||post.status!=='scheduled') {kept++;continue;}
               try{
                 const result=(await gql('mutation RemovePendingNews {deletePost(input:{id:'+q(post.id)+'}){... on DeletePostSuccess{id} ... on MutationError{message}}}'))?.deletePost;
                 if(result?.id!==post.id)throw Error(result?.message||'Buffer did not confirm deletion');
                 console.log('REMOVED_SCHEDULED_NEWS channel='+ch.account+' id='+post.id+' dueAt='+post.dueAt);
                 deleted++;
               }catch(e){console.error('DELETE_FAILED channel='+ch.account+' id='+post.id+' '+e.message);failed++;}
             }
           }
           console.log('QUEUE_CLEANUP_SUMMARY all_scheduled='+total+' removed_scheduled_news='+deleted+' kept_other='+kept+' errors='+failed);
           if(failed)process.exitCode=1;
          })().catch(e=>{console.error('FATAL '+e.message);process.exitCode=1});
          NODE
