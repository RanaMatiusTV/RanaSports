name: Publish RanaSports to X

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/publish-x.cjs'
      - '.github/workflows/publish-x.yml'

permissions:
  contents: write

concurrency:
  group: ranasports-publish-x
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_MAIN_HANDLE: RanaMatiusTV
      BUFFER_F1_HANDLE: RanaF1TV
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Route F2 and F3 to RanaF1TV
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/publish-x.cjs';
          let src = fs.readFileSync(path, 'utf8');
          const oldLine = "const isF1 = c === 'f1' || /\\bformula 1\\b|\\bf1\\b/.test(normalize(item.sport));";
          const newLine = "const isF1 = ['f1', 'f2', 'f3'].includes(c) || /\\bformula [123]\\b|\\bf[123]\\b/.test(normalize(item.sport));";
          if (!src.includes(oldLine)) throw new Error('No se encontró la regla de routing esperada');
          src = src.replace(oldLine, newLine);
          fs.writeFileSync(path, src);
          NODE

      - name: Build and schedule X posts
        run: node scripts/publish-x.cjs

      - name: Save publishing state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/x-publish-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update X publishing state'
          git pull --rebase origin main
          git push origin main
