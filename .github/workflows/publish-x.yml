name: Publish RanaSports to X

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/publish-x.cjs'
      - '.github/workflows/publish-x.yml'

permissions:
  contents: write

concurrency:
  group: ranasports-publish-x
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_MAIN_HANDLE: RanaMatiusTV
      BUFFER_F1_HANDLE: RanaF1TV
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply RanaSports X routing and format
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/publish-x.cjs';
          let src = fs.readFileSync(path, 'utf8');

          const oldRouting = "const isF1 = c === 'f1' || /\\bformula 1\\b|\\bf1\\b/.test(normalize(item.sport));";
          const newRouting = "const isF1 = ['f1', 'f2', 'f3'].includes(c) || /\\bformula [123]\\b|\\bf[123]\\b/.test(corpus);";
          if (src.includes(oldRouting)) src = src.replace(oldRouting, newRouting);
          else if (!src.includes(newRouting)) throw new Error('No se encontró la regla de routing esperada');

          const oldPost = [
            "function postText(item, account, url) {",
            "  const emoji = emojiFor(item, account);",
            "  let title = item.title.trim();",
            "  if (title.length > 190) title = title.slice(0, 187).trimEnd() + '…';",
            "  return `${emoji} ${title}\\n\\n${url}`;",
            "}"
          ].join('\n');

          const newPost = [
            "function linkEmojiFor(item, account) {",
            "  const corpus = normalize(`${item.sport} ${item.title} ${item.summary}`);",
            "  if (/choque|choco|chocó|accidente|golpe|contra el muro|se estrello|se estrelló|impacto/.test(corpus)) return '💥';",
            "  if (/lesion|lesión|lesionado|lesionada|parte medico|parte médico|hospital|operacion|operación/.test(corpus)) return '🤕';",
            "  if (/campeon|campeón|titulo|título|consagro|consagró|ganó|gano|victoria|triunfo/.test(corpus)) return '🏆';",
            "  if (/gol|goleo|goleó|hat-trick|doblete/.test(corpus)) return '⚽';",
            "  if (/record|récord|historico|histórico/.test(corpus)) return '📈';",
            "  if (/pole|clasificacion|clasificación|qualifying|largara|largará/.test(corpus)) return '⏱️';",
            "  if (/mercado|refuerzo|fichaje|transferencia|contrato|firma|firmo|firmó|llega|se va|venta|prestamo|préstamo/.test(corpus)) return '🔄';",
            "  if (/declar|dijo|afirmo|afirmó|hablo|habló|explico|explicó|conto|contó|revelo|reveló/.test(corpus)) return '🗣️';",
            "  if (/sancion|sanción|suspendido|suspension|suspensión|expulsado|expulsion|expulsión|inhabilitado/.test(corpus)) return '🚫';",
            "  if (/polemica|polémica|escandalo|escándalo|cruce|pelea|tension|tensión/.test(corpus)) return '🔥';",
            "  if (item.category === 'independiente') return '🔴';",
            "  if (item.category === 'seleccion') return '🇦🇷';",
            "  if (/\\bcolapinto\\b|\\bvarrone\\b|\\bcolnaghi\\b|\\bfenestraz\\b|\\bargentin[oa]s?\\b/.test(corpus)) return '🇦🇷';",
            "  if (account === 'f1') return '🏁';",
            "  return '⚽';",
            "}",
            "",
            "function postText(item, account, url) {",
            "  const emoji = emojiFor(item, account);",
            "  const linkEmoji = linkEmojiFor(item, account);",
            "  let title = item.title.trim();",
            "  if (title.length > 190) title = title.slice(0, 187).trimEnd() + '…';",
            "  return `${emoji} ${title}\\n\\n🔗${linkEmoji} ${url}`;",
            "}"
          ].join('\n');

          if (src.includes(oldPost)) src = src.replace(oldPost, newPost);
          else if (!src.includes('🔗${linkEmoji} ${url}')) throw new Error('No se encontró el formato de post esperado');

          fs.writeFileSync(path, src);
          NODE

      - name: Build and schedule X posts
        run: node scripts/publish-x.cjs

      - name: Save publishing state
        run: |
          git checkout -- scripts/publish-x.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/x-publish-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update X publishing state'
          git pull --rebase origin main
          git push origin main
