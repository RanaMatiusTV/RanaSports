name: Publish RanaSports to X

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ranasports-publish-x
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_MAIN_HANDLE: RanaMatiusTV
      BUFFER_F1_HANDLE: RanaF1TV
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and schedule X posts
        run: node scripts/publish-x.cjs

      - name: Save publishing state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/x-publish-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update X publishing state'
          git pull --rebase origin main
          git push origin main
