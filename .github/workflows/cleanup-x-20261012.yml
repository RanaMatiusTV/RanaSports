name: Cleanup Buffer extra failed Oct 12 retry copies
on:
  push:
    paths:
      - .github/workflows/cleanup-x-20261012.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Delete only the newly created failed copies and restore original IDs
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const state=JSON.parse(fs.readFileSync('.github/x-publish-state.json','utf8'));
          const org=state.buffer?.organizationId,channel=state.buffer?.mainChannelId;
          const key=process.env.BUFFER_API_KEY;
          const q=v=>JSON.stringify(String(v));
          if(!org||!channel||!key)throw new Error('Buffer connection data missing');
          async function api(query){
           const r=await fetch('https://api.buffer.com',{method:'POST',headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify({query})});
           const d=await r.json();if(!r.ok||d.errors?.length)throw new Error(d.errors?.[0]?.message||'HTTP '+r.status);return d.data;
          }
          async function fetchAll(){
           let all=[],cursor;
           for(let i=0;i<6;i++){
           const qq='query CleanupAudit {posts(first:100'+(cursor?',after:'+q(cursor):'')+',input:{organizationId:'+q(org)+',filter:{channelIds:['+q(channel)+'],status:[error,sent,scheduled,sending],startDate:"2026-10-12T03:00:00.000Z",endDate:"2026-10-13T03:00:00.000Z"}}){edges{node{id status dueAt createdAt externalLink}}pageInfo{hasNextPage endCursor}}}';
           const d=await api(qq);const p=d?.posts;if(!p?.edges)throw Error('Buffer query incomplete');all.push(...p.edges.map(e=>e.node));if(!p.pageInfo?.hasNextPage)return all;cursor=p.pageInfo.endCursor;
           }throw Error('Too many posts');
          }
          (async()=>{
           const posts=await fetchAll();
           const mapped=new Map(posts.map(p=>[p.id,p]));
           let deleted=0,keep=0,errors=0;
           for(const [url,item] of Object.entries(state.processed||{}).filter(([u,v])=>v.recoveryDate==='2026-10-12'&&v.account==='main')){
             const fresh=mapped.get(item.bufferPostId), original=mapped.get(item.recoveredFromPostId);
             if(!fresh||fresh.status!=='error'||fresh.externalLink||!original){
               console.log('KEEP '+item.title+' fresh='+(fresh?.status||'not_found')+' original='+(original?.status||'not_found'));keep++;continue;
             }
             try{
               const d=await api('mutation Cleanup {deletePost(input:{id:'+q(item.bufferPostId)+'}){... on DeletePostSuccess{id} ... on MutationError{message}}}');
               if(d?.deletePost?.id!==item.bufferPostId) throw new Error(d?.deletePost?.message||'Deletion not confirmed');
               const restored={...item,bufferPostId:item.recoveredFromPostId,dueAt:original.dueAt,createdAt:original.createdAt,mode:'customScheduled'};
               delete restored.recoveredFromPostId;delete restored.recoveryDate;delete restored.externalLink;
               state.processed[url]=restored;
               console.log('DELETED_FAILED_COPY '+item.title);deleted++;
             }catch(e){console.error('CLEANUP_FAIL '+item.title+' '+e.message);errors++;}
           }
           if(deleted)fs.writeFileSync('.github/x-publish-state.json',JSON.stringify(state,null,2)+'\n');
           console.log('CLEANUP_SUMMARY deleted='+deleted+' kept='+keep+' errors='+errors);
           if(errors)process.exitCode=1;
          })().catch(e=>{console.error('FATAL '+e.message);process.exitCode=1});
          NODE
      - name: Persist restored publishing references
        if: always()
        run: |
          if git diff --quiet -- .github/x-publish-state.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/x-publish-state.json
          git commit -m 'Restore original X failed-post references'
          git pull --rebase origin main
          git push origin main
