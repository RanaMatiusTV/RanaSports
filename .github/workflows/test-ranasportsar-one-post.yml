name: Test one RanaSportsAR news post to X
on:
  push:
    paths:
      - '.github/workflows/test-ranasportsar-one-post.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish exactly one current sports article (never retry)
        run: |
          node <<'NODE'
          (async()=>{const fs=require('fs'),config=JSON.parse(fs.readFileSync('config/x-distribution.json','utf8'));
          if(config.enabled||!config.dryRun)throw Error('Stop: regular distribution is active');
          const token=process.env.BUFFER_API_KEY,org='6aa4288ba2d30cc3deb9575b';
          if(!token)throw Error('Missing API');
          async function gql(query){
            const r=await fetch('https://api.buffer.com',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({query})});
            const j=await r.json();if(!r.ok||j.errors?.length)throw Error(j.errors?.[0]?.message||String(r.status));return j.data;
          }
          const ch=(await gql('query{channels(input:{organizationId:"'+org+'"}){id name displayName service}}'))?.channels||[];
          const target=ch.find(c=>c.service==='twitter'&&[c.name,c.displayName].some(n=>String(n||'').replace(/^@/,'').toLowerCase()==='ranasportsar'));
          if(!target)throw Error('RanaSportsAR not found');
          const raw=fs.readFileSync('assets/news-live.csv','utf8');
          function parse(src){const out=[];let row=[],v='',q=false;for(let i=0;i<src.length;i++){const c=src[i];if(c==='"'){if(q&&src[i+1]==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){row.push(v);out.push(row);row=[];v='';if(c==='\r'&&src[i+1]==='\n')i++}else v+=c}if(v||row.length){row.push(v);out.push(row)}return out}
          const data=parse(raw),head=data.shift().map(x=>x.toLowerCase()),idx=x=>head.indexOf(x.toLowerCase());
          let found=null;
          for(const row of data.reverse()){
            const pub=String(row[idx('Publicar')]||'').toLowerCase(), cat=String(row[idx('Categoría')]||'').toLowerCase(),title=row[idx('Título')],date=row[idx('Fecha')],time=row[idx('Hora')];
            if(pub!=='si'||!title||/fórmula|formula|f1|f2|f3|independiente/.test(cat))continue;
            const mt=String(date||'').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/),tm=String(time||'').match(/^(\d{1,2}):(\d{2})/);
            if(!mt||!tm)continue;
            const at=Date.UTC(+mt[3],+mt[2]-1,+mt[1],+tm[1]+3,+tm[2]);
            if(at>Date.now()||Date.now()-at>4*3600000)continue;
            found={cat,title,date:at};break;
          }
          if(!found)throw Error('No recent non-F1 non-Independiente article; no tweet sent');
          const identity=JSON.stringify([found.cat.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(),found.date,found.title]);
          const link='https://ranasports.com.ar/noticia.html?n='+Buffer.from(identity).toString('base64url');
          const text='🐸📰 '+found.title.slice(0,185)+'\n#Deportes\n\n🔗 '+link;
          const result=(await gql('mutation{createPost(input:{text:'+JSON.stringify(text)+',channelId:'+JSON.stringify(target.id)+',schedulingType:automatic,mode:shareNow}){... on PostActionSuccess{post{id dueAt channelId}} ... on MutationError{message}}}'))?.createPost;
          if(!result?.post?.id)throw Error(result?.message||'Buffer rejected test');
          console.log('ONE_BUFFER_TEST_CREATED id='+result.post.id+' title='+found.title);
          const id=result.post.id;
          for(let i=0;i<3;i++){
            await new Promise(r=>setTimeout(r,5000));
            const x=(await gql('query{posts(first:100,input:{organizationId:"'+org+'",filter:{channelIds:["'+target.id+'"],status:[sent,error]}}){edges{node{id status externalLink}}}}'))?.posts?.edges?.map(e=>e.node).find(p=>p.id===id);
            if(x){console.log('ONE_TEST_STATUS='+x.status+' LINK='+(x.externalLink||'none'));if(x.status==='error')process.exitCode=1;break;}
          }
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
