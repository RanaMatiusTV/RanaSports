name: Sync RanaSports news feed
# Extraordinary embed resync: 2026-10-07 11:17 ARG
# Manual feed synchronization requested: 2026-10-08 00:37 ARG
# Normalize football section slugs to /futbol/: 2026-10-14
# Short URL regeneration for X post links: 2026-10-14

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - '.github/workflows/sync-news-live.yml'
      - '.github/radar-sync-pulse.txt'
      - 'scripts/build_pretty_articles.py'
      - 'scripts/build_news_days.py'
      - 'noticia.html'
      - 'assets/news-feed.js'

permissions:
  contents: write

concurrency:
  group: sync-ranasports-news-feed
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and normalize Google Sheet news
        shell: bash
        run: |
          set -euo pipefail
          # Use the published CSV, which is accessible from GitHub Actions.
          # The private spreadsheet /gviz endpoint returns HTTP 401 without Google OAuth.
          # Never publish an older snapshot or omit the last radar's expected headline.
          python3 - <<'PY'
          import csv, datetime, os, re, subprocess, sys, time

          sheet_id = '12VE1D_zlnOvmIWFhdCrKAvCHh6VOwXdaYoAczDh0Fw4'
          published_url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRmbZPf_uxPdpS-phGua9U3PccA2z7Uls3G8r49CLfi37qkMJkpRPDUU7VdAZg_IMI7Ynegy-yxyAhr/pub?output=csv'
          pulse_path = '.github/radar-sync-pulse.txt'
          pulse = open(pulse_path, encoding='utf-8').read() if os.path.isfile(pulse_path) else ''
          match = re.search(r'^\s*(?:Última noticia|Última):\s*(.+?)\s*$', pulse, re.MULTILINE | re.IGNORECASE)
          expected_title = match.group(1).strip().casefold() if match else None

          def timestamp(row):
              d, t = row[1].strip(), row[2].strip()
              for fmt in ('%d/%m/%Y %H:%M:%S', '%d/%m/%Y %H:%M',
                          '%Y-%m-%d %H:%M:%S', '%Y-%m-%d %H:%M'):
                  try:
                      return datetime.datetime.strptime(f'{d} {t}', fmt)
                  except ValueError:
                      continue
              return datetime.datetime.min

          def read_feed(path):
              with open(path, encoding='utf-8-sig', newline='') as f:
                  rows = list(csv.reader(f))
              if not rows or len(rows[0]) < 18 or rows[0][0].strip().lower() != 'publicar':
                  raise ValueError('Unexpected CSV header')
              return [r for r in rows[1:] if len(r) >= 5 and r[0].strip().upper() == 'SI' and r[4].strip()]

          previous = read_feed('assets/news-live.csv') if os.path.isfile('assets/news-live.csv') else []
          previous_max = max((timestamp(r) for r in previous), default=datetime.datetime.min)
          # Google's published CSV can lag the editable Sheet. Allow it time to refresh
          # rather than failing on the first stale response (cron/push will retry too).
          max_attempts = 20
          for attempt in range(1, max_attempts + 1):
              for label, base_url in [('published', published_url)]:
                  url = f'{base_url}&_={time.time_ns()}'
                  cmd = ['curl', '-fLsS', '--retry', '2', '--retry-delay', '2',
                         '--connect-timeout', '15', '--max-time', '90',
                         '-H', 'Cache-Control: no-cache', url, '-o', '/tmp/news-candidate.csv']
                  try:
                      subprocess.run(cmd, check=True)
                      current = read_feed('/tmp/news-candidate.csv')
                      current_max = max((timestamp(r) for r in current), default=datetime.datetime.min)
                      found = not expected_title or any(r[4].strip().casefold() == expected_title for r in current)
                      if current_max < previous_max or not found:
                          print(f'::warning::{label} attempt {attempt} stale: '
                                f'incoming={current_max}, existing={previous_max}, '
                                f'pulse_title_present={found}', flush=True)
                          continue
                      os.replace('/tmp/news-candidate.csv', '/tmp/news.csv')
                      print(f'Accepted {label} Sheet CSV: newest={current_max}; '
                            f'pulse_title_present={found}', flush=True)
                      sys.exit(0)
                  except (subprocess.CalledProcessError, ValueError, OSError) as e:
                      print(f'::warning::{label} attempt {attempt} unavailable: {e}', flush=True)
              if attempt < max_attempts:
                  time.sleep(15)
          print('::error::Published Sheet CSV is stale or unavailable after extended retries; preserving the last known-good news feed', flush=True)
          sys.exit(1)
          PY
          python3 - <<'PY'
          import csv, datetime, os, sys

          src='/tmp/news.csv'
          dst='assets/news-live.csv'

          with open(src, encoding='utf-8-sig', newline='') as f:
              rows=list(csv.reader(f))
          if not rows or len(rows[0]) < 18 or rows[0][0].strip().lower() != 'publicar':
              raise SystemExit('Invalid Google Sheets CSV')

          # Keep optional editorial columns (Cuerpo / Contenido / Texto completo).
          # The first 18 columns retain their existing meaning and positions.
          header=rows[0]
          width=len(header)
          data=[]
          for row in rows[1:]:
              row=(row+['']*width)[:width]
              if row[0].strip().upper()!='SI' or not row[4].strip():
                  continue
              data.append(row)

          def stamp(row):
              d=row[1].strip()
              t=row[2].strip()
              for fmt in ('%d/%m/%Y %H:%M:%S','%d/%m/%Y %H:%M','%Y-%m-%d %H:%M:%S','%Y-%m-%d %H:%M'):
                  try:
                      return datetime.datetime.strptime(f'{d} {t}', fmt)
                  except ValueError:
                      pass
              return datetime.datetime.min

          data.sort(key=stamp, reverse=True)
          # Editorial safety net: hide highly confident reprints of the SAME
          # incident, even if different media supplied different source URLs.
          # This is display/export-only: no radar, Sheet row or schedule changes.
          # Require the same individual video AND >=6 significant shared title
          # words within 36 hours. Distinct developments remain separate.
          import re, unicodedata
          skip_words = {'ante','como','con','del','desde','despues','entre',
                        'esta','este','fue','hace','hasta','las','los','para',
                        'pero','por','que','sin','sobre','sus','tras','una',
                        'uno','al','de','el','en','la','un','y'}
          def title_words(title):
              plain = unicodedata.normalize('NFKD', title.casefold())
              plain = ''.join(c for c in plain if not unicodedata.combining(c))
              return {w for w in re.findall(r'[a-z0-9]+', plain)
                      if len(w) >= 3 and w not in skip_words}
          def individual_video(value):
              return bool(re.search(
                  r'(?:x\.com|twitter\.com)/[^/]+/status/[0-9]+|'
                  r'(?:youtube\.com/watch\?v=|youtu\.be/)[\w-]{8,}',
                  value, re.I))
          seen_by_video = {}
          kept_ascending = []
          omitted_reprints = 0
          for candidate in reversed(data):
              video = candidate[10].strip() if len(candidate) > 10 else ''
              words = title_words(candidate[4])
              when = stamp(candidate)
              repeated = False
              if video and individual_video(video) and when != datetime.datetime.min:
                  for earlier in seen_by_video.get(video, []):
                      previous_words, previous_time = earlier
                      if abs((when - previous_time).total_seconds()) > 36 * 3600:
                          continue
                      common = len(words & previous_words)
                      if (common >= 6 and
                          common / max(1, min(len(words), len(previous_words))) >= 0.70):
                          repeated = True
                          break
              if repeated:
                  omitted_reprints += 1
                  continue
              kept_ascending.append(candidate)
              if video and individual_video(video) and when != datetime.datetime.min:
                  seen_by_video.setdefault(video, []).append((words, when))
          data = list(reversed(kept_ascending))
          if omitted_reprints:
              print(f'Suppressed {omitted_reprints} confirmed same-video/title reprints in feed')
          # Emergency repair: replace the broken March match image in this one story.
          # The photo is of the actual goalscorer (archive portrait), not a false match shot.
          target_title = "GIMNASIA DE MENDOZA VOLVIÓ AL TRIUNFO CON UN GOLAZO DE MÓDICA ANTE NEWELL'S"
          fallback_photo = "https://www.minutoya.com.ar/uploads/2026/07/24/1784931961133-gimnasia-hero.jpg"
          for item in data:
              if item[4].strip() == target_title and (
                  'diariopanorama.com/fotos/cache/notas/2026/03/21/' in item[7]
                  or 'media.diariouno.com.ar/p/5a3b401a88c754f826482384fa5cdf12/' in item[7]
              ):
                  item[7] = fallback_photo
                  item[11] = 'MINUTOYA / FOTO DE ARCHIVO DE AGUSTÍN MÓDICA'
                  if len(item) > 16:
                      item[16] = fallback_photo
                  print('Repaired broken Gimnasia image in live feed')
          archive='assets/news-archive.csv'
          all_data=data
          data=all_data[:600]
          incoming_max=max((stamp(r) for r in all_data), default=datetime.datetime.min)

          existing_max=datetime.datetime.min
          if os.path.exists(dst):
              with open(dst, encoding='utf-8-sig', newline='') as f:
                  old=list(csv.reader(f))
              existing=[(r+['']*18)[:18] for r in old[1:] if r and (r[0] if len(r)>0 else '').strip().upper()=='SI']
              existing_max=max((stamp(r) for r in existing), default=datetime.datetime.min)

          if incoming_max < existing_max:
              print(f'Skip regression: incoming {incoming_max} < existing {existing_max}')
              sys.exit(0)

          for target, rows_to_write in ((dst, data), (archive, all_data)):
              with open(target+'.tmp','w',encoding='utf-8',newline='') as f:
                  w=csv.writer(f,lineterminator='\r\n')
                  w.writerow(header)
                  w.writerows(rows_to_write)
              os.replace(target+'.tmp',target)
          print(f'Synced {len(data)} live rows and {len(all_data)} archive rows; newest={incoming_max}')
          PY

      - name: Commit news feed and SEO sitemaps
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "RanaSports Bot"
          git config user.email "actions@users.noreply.github.com"

          # Retain the proven feed sync's fetch/reset/retry behavior.
          cp assets/news-live.csv /tmp/news-live.csv
          cp assets/news-archive.csv /tmp/news-archive.csv
          git restore assets/news-live.csv
          git restore assets/news-archive.csv 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/news-live.csv assets/news-live.csv
          cp /tmp/news-archive.csv assets/news-archive.csv

          # SEO is best-effort: a sitemap error must NEVER prevent news sync.
          stage_changes() {
            git add assets/news-live.csv assets/news-archive.csv
            # Legacy links need only the date's lightweight feed, not 600+ articles.
            if python3 scripts/build_news_days.py; then
              git add -A -- assets/news-days
            else
              echo "::warning::Daily article feeds skipped; existing links use legacy fallback."
            fi
            # Static sport/title pages and URL map are best-effort: never block the feed.
            if python3 scripts/build_pretty_articles.py; then
              git add -- assets/article-routes.js
              if [ -f /tmp/ranasports-pretty-pages.txt ]; then
                while IFS= read -r page; do
                  [ -z "$page" ] || git add -- "$page"
                done < /tmp/ranasports-pretty-pages.txt
              fi
            else
              echo "::warning::Pretty pages skipped; legacy links stay valid."
            fi
            if python3 scripts/build_sitemaps.py; then
              git add sitemap.xml sitemap-news.xml
            else
              echo "::warning::SEO sitemap refresh failed, publishing news without it."
            fi
          }

          stage_changes
          if git diff --cached --quiet; then
            echo "No feed or sitemap changes"
            exit 0
          fi
          git commit -m "Auto-sync RanaSports news feed and sitemaps"

          # Keep the existing 3 safe retries against concurrent writers.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push collision (attempt $attempt); refreshing main and retrying..."
            cp assets/news-live.csv /tmp/news-live.csv
            cp assets/news-archive.csv /tmp/news-archive.csv
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/news-live.csv assets/news-live.csv
            cp /tmp/news-archive.csv assets/news-archive.csv
            stage_changes
            if git diff --cached --quiet; then
              echo "Feed and sitemaps already published by another run"
              exit 0
            fi
            git commit -m "Auto-sync RanaSports news feed and sitemaps"
            sleep $((attempt * 2))
          done

          echo "Unable to push feed after 3 attempts"
          exit 1

      - name: Verify news reached the public portal
        timeout-minutes: 6
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, datetime, io, time, urllib.request

          def read_news(text):
              rows = list(csv.reader(io.StringIO(text.lstrip('\ufeff'))))
              if not rows or rows[0][0].strip().lower() != 'publicar':
                  raise ValueError('Invalid portal CSV')
              return [r for r in rows[1:] if len(r) >= 5 and r[0].strip().upper() == 'SI']

          def stamp(row):
              for fmt in ('%d/%m/%Y %H:%M:%S', '%d/%m/%Y %H:%M',
                          '%Y-%m-%d %H:%M:%S', '%Y-%m-%d %H:%M'):
                  try:
                      return datetime.datetime.strptime(f'{row[1].strip()} {row[2].strip()}', fmt)
                  except ValueError:
                      continue
              return datetime.datetime.min

          with open('/tmp/news-live.csv', encoding='utf-8-sig') as f:
              expected = read_news(f.read())
          newest = max(map(stamp, expected), default=datetime.datetime.min)
          expected_latest = {(r[1], r[2], r[4]) for r in expected if stamp(r) == newest}
          for attempt in range(1, 13):
              try:
                  url = 'https://ranasports.com.ar/assets/news-live.csv?_verify=' + str(time.time_ns())
                  request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(request, timeout=10) as response:
                      public = read_news(response.read().decode('utf-8-sig'))
                  public_latest = max(map(stamp, public), default=datetime.datetime.min)
                  identities = {(r[1], r[2], r[4]) for r in public}
                  if expected_latest <= identities and public_latest >= newest:
                      print(f'Portal verified: newest={public_latest}', flush=True)
                      break
                  print(f'Waiting for Pages: attempt={attempt}, public={public_latest}, expected={newest}', flush=True)
              except Exception as error:
                  print(f'::warning::Portal verification attempt {attempt}: {error}', flush=True)
              if attempt < 12:
                  time.sleep(15)
          else:
              raise SystemExit('News committed but portal not updated: synchronization is NOT verified')
          PY
