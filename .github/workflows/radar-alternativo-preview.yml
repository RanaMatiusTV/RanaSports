name: Radar Alternativo - Vista Previa
on:
  workflow_dispatch:
  schedule:
    - cron: '15 10,12,14,16,18,20,22,0,2 * * *'
permissions:
  contents: write
concurrency:
  group: ranasports-radar-alternativo-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recolectar candidatos sin publicar
        run: python3 scripts/radar_alternativo_preview.py
      - name: Guardar vista previa solamente
        run: |
          if [ -z "$(git status --porcelain -- assets/radar-alternativo-preview.json)" ]; then exit 0; fi
          git config user.name "RanaSports Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/radar-alternativo-preview.json
          git commit -m "Radar alternativo: actualizar vista previa"
          git pull --rebase origin main
          git push origin HEAD:main
