name: Refresh search trends
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: update-search-trends
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/update-trends.cjs
      - name: Save snapshot without rewriting history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/trends.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Argentina search trends'
          git pull --rebase origin main
          git push origin main
      - name: Refresh branch-based Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
