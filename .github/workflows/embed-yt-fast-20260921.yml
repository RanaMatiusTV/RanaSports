name: Fast YouTube embed search 2026-09-21
on:
  push:
    branches: [main]
    paths:
      - 'tmp/embed-yt-trigger-20260921.txt'
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Search YouTube
        run: |
          python - <<'PY'
          import json,re,html,unicodedata,urllib.parse,urllib.request,concurrent.futures,time
          from pathlib import Path
          rows=json.loads(Path("tmp/embed-backlog-20260921.json").read_text(encoding="utf-8"))
          STOP=set("""EL LA LOS LAS UN UNA UNOS UNAS DE DEL Y O EN POR PARA CON SIN A AL ANTE TRAS SOBRE QUE SE SU SUS ES SON FUE FUERON YA VA VAN COMO MAS ENTRE DESDE HASTA ESTA ESTE ESTOS ESTAS LO LE LES HOY AYER MANANA NUEVO NUEVA OTRA OTRO DIA JORNADA""".split())
          def norm(s):
            s=unicodedata.normalize("NFD",s or "")
            s="".join(c for c in s if unicodedata.category(c)!="Mn")
            return re.sub(r"[^A-Z0-9]+"," ",s.upper()).strip()
          def toks(s): return [w for w in norm(s).split() if len(w)>=3 and w not in STOP]
          def fetch(url,timeout=10):
            req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36","Accept-Language":"es-AR,es;q=0.9,en;q=0.6"})
            with urllib.request.urlopen(req,timeout=timeout) as r:return r.read().decode("utf-8","ignore")
          def yt(q):
            try:
              u="https://www.youtube.com/results?search_query="+urllib.parse.quote(q)
              pg=fetch(u,10)
            except Exception:return []
            # Extract videoRenderer blocks conservatively
            out=[]
            for m in re.finditer(r'"videoRenderer":\{"videoId":"([^"]+)".{0,10000}?"title":\{"runs":\[\{"text":"((?:\\.|[^"])*)"',pg,re.S):
              vid=m.group(1)
              try: title=json.loads('"'+m.group(2)+'"')
              except: title=m.group(2)
              if vid not in [x["id"] for x in out]:
                out.append({"id":vid,"title":title})
              if len(out)>=7:break
            if not out:
              # fallback generic videoId extraction
              seen=[]
              for vid in re.findall(r'"videoId":"([A-Za-z0-9_-]{11})"',pg):
                if vid not in seen:
                  seen.append(vid);out.append({"id":vid,"title":""})
                if len(out)>=7:break
            return out
          def score(story,cand):
            st=set(toks(story));ct=set(toks(cand)); ov=sorted(st&ct)
            distinct=[x for x in ov if len(x)>=5]
            sc=len(ov)+0.4*len(distinct)
            # Require enough identity/context overlap; generic ARGENTINA/SANTA FE alone isn't enough
            return sc,ov
          def one(row):
            title=row.get("title","")
            ts=toks(title)
            qs=[title]
            if len(ts)>7: qs.append(" ".join(ts[:8]))
            found={}
            for q in qs:
              for c in yt(q):
                if c["id"] not in found:found[c["id"]]=c
              if len(found)>=5:break
            cs=[]
            for c in found.values():
              sc,ov=score(title,c.get("title",""))
              cs.append({"url":"https://www.youtube.com/watch?v="+c["id"],"title":c.get("title",""),"score":sc,"overlap":ov})
            cs.sort(key=lambda z:z["score"],reverse=True)
            return {**row,"candidates":cs[:5]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=24) as ex:
            res=list(ex.map(one,rows))
          Path("tmp/embed-yt-results-20260921.json").write_text(json.dumps(res,ensure_ascii=False,indent=2),encoding="utf-8")
          print("with candidates",sum(1 for x in res if x["candidates"]),"of",len(res))
          PY
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/embed-yt-results-20260921.json
          git commit -m "Generate fast YouTube embed candidates" || exit 0
          git push
