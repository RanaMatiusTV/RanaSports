<script>window.RS_ARTICLE_ID="WyJib2NhIGp1bmlvcnMiLDE3OTUzMTA5NDAwMDAsIlNVU1RPIEVOIEJPQ0E6IExFQU5EUk8gUEFSRURFUyBTRSBERVNNQVnDkyBFTiBQTEVOQSBFTlRSRVZJU1RBIFRSQVMgU0VSIENBTVBFw5NOIl0";window.RS_ARTICLE_CSV="publicar,fecha,hora,categoria,titulo,resumen,url nota,url imagen,fuente,url fuente,url video,credito foto,destacada,url x respaldo,estado imagen,criterio imagen,url imagen candidata,🔒 bloqueo manual,url video 2\nSI,21/11/2026,22:29,BOCA JUNIORS,SUSTO EN BOCA: LEANDRO PAREDES SE DESMAYÓ EN PLENA ENTREVISTA TRAS SER CAMPEÓN,\"La celebración de Boca Juniors por la conquista de la Copa Sudamericana 2026 tuvo un momento de preocupación en Barranquilla. Leandro Paredes se desmayó mientras daba una entrevista en vivo con Marcelo Benedetto para DSports, poco después de que el Xeneize derrotara 2-0 a Atlético Mineiro. La transmisión mostró cómo el capitán perdía la estabilidad y debía recibir asistencia, en una escena que rápidamente se difundió en las redes sociales.\n\nEl episodio ocurrió después de una final disputada bajo un calor intenso. Paredes ya había presentado signos de agotamiento durante el partido: fue reemplazado en el segundo tiempo y recibió atención en el banco de suplentes. Según informó DSports, el mediocampista sufrió una baja de presión y fue asistido de inmediato por el personal médico. Por su parte, ESPN transmitió que los médicos de Boca confirmaron el descenso de presión.\n\nLa buena noticia llegó poco después del susto. El futbolista se recuperó rápidamente y, de acuerdo con el periodista que lo entrevistaba, pudo retirarse hacia el vestuario por sus propios medios. El hecho no empañó la conquista internacional de Boca, pero recordó el desgaste físico que atravesaron los protagonistas durante la definición en Colombia. El video del momento quedó registrado durante la transmisión y circuló en X.\",https://www.directvsports.com/futbol/susto-leandro-paredes-se-desmayo-en-plena-entrevista-post-partido-con-dsports-20261121-0047.html,https://media.lmne
